name: Lab App Bot Identity Smoke
on:
  pull_request:
    types: [opened]
permissions:
  contents: read
jobs:
  bot-identity-smoke:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'lab/github-app-bot-smoke-20261024' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtain short-lived token for the single selected test repository
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.LAB_APP_ID }}
          private-key: ${{ secrets.LAB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: agentdock-architecture-gate-lab
      - name: Create synthetic bot-owned PR and assert no admin access
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            let denied = false;
            try {
              await github.rest.repos.getBranchProtection({owner, repo, branch: 'main'});
            } catch (err) {
              if (err.status === 403 || err.status === 404) {
                denied = true;
                core.info('ADMIN_READ_BLOCKED_EXPECTED_HTTP_' + err.status);
              } else {
                throw err;
              }
            }
            if (!denied) {
              core.setFailed('APP_UNEXPECTED_ADMIN_READ_ACCESS');
              return;
            }
            const main = await github.rest.repos.getBranch({owner, repo, branch: 'main'});
            const branch = 'lab/app-proof-' + context.runId;
            await github.rest.git.createRef({
              owner, repo, ref: 'refs/heads/' + branch,
              sha: main.data.commit.sha
            });
            const note = [
              '# Synthetic GitHub App identity proof',
              '',
              'No AgentDock Next or Legacy source. This file was created in an isolated public GitHub fixture.',
              '',
              'GitHub Actions run: ' + context.runId,
              'Repository: ' + owner + '/' + repo,
              ''
            ].join('\n');
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo,
              path: 'docs/bot-identity-' + context.runId + '.md',
              message: 'lab: restricted GitHub App synthetic PR evidence',
              content: Buffer.from(note, 'utf8').toString('base64'),
              branch
            });
            const pr = await github.rest.pulls.create({
              owner, repo, head: branch, base: 'main',
              title: 'LAB GitHub App identity proof (requires independent human review)',
              body: 'Created with a short-lived, restricted GitHub App installation token. Expected checks pass, but merge must be blocked pending a review by usagidelice. No AgentDock Next/Legacy production code.',
              draft: false
            });
            core.info('APP_CREATED_PR_NUMBER=' + pr.data.number);
            core.info('APP_CREATED_PR_URL=' + pr.data.html_url);
