name: Lab trusted App authentication proof

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-restricted-app:
    if: ${{ github.repository == 'usagidelice/agentdock-architecture-gate-lab' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: lab-trusted-app
    steps:
      - name: Mint short-lived read-only installation token
        id: lab-app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.LAB_APP_ID }}
          private-key: ${{ secrets.LAB_APP_PRIVATE_KEY }}
          owner: usagidelice
          repositories: agentdock-architecture-gate-lab
          permission-contents: read

      - name: Assert App has no repository administration rights
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.lab-app.outputs.token }}
          script: |
            const {owner, repo} = context.repo;
            const file = await github.rest.repos.getContent({
              owner, repo, path: 'docs/LAB_SCOPE.md'
            });
            if (!file.data || file.data.type !== 'file') {
              core.setFailed('APP_TOKEN_REPO_READ_FAILED');
              return;
            }
            let administrationBlocked = false;
            try {
              await github.rest.repos.getBranchProtection({
                owner, repo, branch: 'main'
              });
            } catch (err) {
              if (err.status === 403 || err.status === 404) {
                administrationBlocked = true;
                core.info('App token denied administration endpoint as expected.');
              } else {
                throw err;
              }
            }
            if (!administrationBlocked) {
              core.setFailed('APP_TOKEN_HAS_UNEXPECTED_ADMIN_ACCESS');
              return;
            }
            core.info('LAB_ENVIRONMENT_APP_AUTH_SUCCESS');
