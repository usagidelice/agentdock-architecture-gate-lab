name: Architecture gate
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: read
jobs:
  architecture-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate paths from trusted base workflow
        uses: actions/github-script@v7
        with:
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100
            });
            const names = files.map(file => file.filename);
            const permitted = path =>
              path === 'README.md' || /^(src|tests|docs)\//.test(path);
            const forbiddenModule = path =>
              /(^|\/)(supervisor|watchdog|runner|control-center|task-manager)(\.|\/|$)/i.test(path);
            const rejected = names.filter(path => !permitted(path) || forbiddenModule(path));
            core.info('Changed: ' + names.join(', '));
            if (rejected.length) {
              core.setFailed('ARCHITECTURE_CHANGE_REQUIRES_EXTERNAL_APPROVAL: ' + rejected.join(', '));
            } else {
              core.info('L0 fixture paths accepted for independent CI/review');
            }
